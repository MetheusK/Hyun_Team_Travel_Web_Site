<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyun Team Travel</title>
    <meta name="description" content="전 세계 주요 국가와 도시의 관광지, 맛집, 카페, 액티비티, 가성비 숙소를 한눈에 살펴보는 Hyun Team Travel 여행 가이드">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Hyun Team Travel - 세계 여행 가이드">
    <meta property="og:description" content="인터랙티브 세계 지도와 함께 전 세계 주요 도시의 추천 관광지, 맛집, 카페, 액티비티, 숙소를 탐색해 보세요.">
    <meta property="og:image" content="./images/korea_main.jpg">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    <link rel="preload" href="./data/countries-110m.json" as="fetch" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
    <link rel="stylesheet" href="./css/style.css">
    <!-- D3.js and TopoJSON -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>

<body>
    <div id="intro-page"></div>
    <div id="main-content">
        <section class="hero-slider"><button class="nav-btn prev" onclick="moveSlide(-1)">&#10094;
            </button>
            <div id="slide-container"></div><button class="nav-btn next" onclick="moveSlide(1)">&#10095;

            </button>
        </section>
        <main id="sub-page" class="sub-page">
            <!-- Regional Navigation -->
            <nav class="region-nav-container">
                <ul class="region-list" id="region-nav">
                    <!-- Dynamically populated -->
                </ul>
            </nav>
            <h1 id="country-title" style="font-size: 4rem; margin-bottom: 15px;"></h1>
            <div class="city-tabs" id="city-tabs"></div>
            <div class="category-menu"><button class="cat-link active" onclick="showCategory('attractions')">🏛️
                    관광지</button><button class="cat-link" onclick="showCategory('restaurants')">🍽️ 맛집 &
                    간식</button><button class="cat-link" onclick="showCategory('cafes')">☕ 추천 카페</button><button
                    class="cat-link" onclick="showCategory('activities')">🏃 액티비티</button><button class="cat-link"
                    onclick="showCategory('hotels')">🏨 가성비 숙소</button></div>
            <div id="content-display" class="content-grid"></div>
            <div class="next-dest-container"><button class="next-dest-btn" onclick="returnToMap()">NEXT
                    DESTINATION</button></div>

        </main>
    </div> <!-- End of #main-content -->
    <script src="./data/travel_data.js"></script>
    <script>
        let currentRegion = null;

        // Render Navigation Bar
        function renderNavigation() {
            const navContainer = document.getElementById('region-nav');
            if (!navContainer) return;
            navContainer.innerHTML = '';

            for (const [region, countries] of Object.entries(regionData)) {
                const li = document.createElement('li');
                li.className = 'region-item';

                // Region Button
                const btn = document.createElement('button');
                btn.className = 'region-btn';

                btn.innerHTML = `${region
                    }

                <span style="font-size: 0.8rem">▼</span>`;
                btn.onclick = (e) => toggleRegion(region, li);

                li.appendChild(btn);

                // Country Dropdown (if countries exist)
                if (countries.length > 0) {
                    const dropdown = document.createElement('div');
                    dropdown.className = 'country-dropdown';

                    countries.forEach(country => {
                        const link = document.createElement('div');
                        link.className = 'country-link';
                        link.textContent = country;

                        link.onclick = (e) => {
                            e.stopPropagation();
                            handleCountrySelect(country);
                        }

                            ;
                        dropdown.appendChild(link);
                    });

                    li.appendChild(dropdown);
                }

                navContainer.appendChild(li);
            }
        }

        // Toggle Region Dropdown
        function toggleRegion(region, element) {
            if (currentRegion === region) {
                element.classList.remove('active');
                currentRegion = null;
                return;
            }

            document.querySelectorAll('.region-item').forEach(el => el.classList.remove('active'));

            element.classList.add('active');
            currentRegion = region;
        }

        // Handle Country Selection
        function handleCountrySelect(country) {
            if (!travelData[country]) return;

            // Use existing openCountry logic but we might need to adapt it 
            // if openCountry expects a slide click. 
            // Currently openCountry calls selectCity(firstCity).
            // Let's reuse openCountry as it handles view switching and rendering.
            openCountry(country);

            // Close dropdowns
            document.querySelectorAll('.region-item').forEach(el => el.classList.remove('active'));
            currentRegion = null;
        }

        // Initialize Navigation
        document.addEventListener('DOMContentLoaded', () => {
            renderNavigation();
        });

        let currentSlide = 0;
        const countries = Object.keys(travelData);
        let selectedCountry = "";
        let selectedCity = "";

        const slideContainer = document.getElementById('slide-container');

        countries.forEach((country, idx) => {
            const slide = document.createElement('div');

            slide.className = `slide ${idx === 0 ? 'active' : ''
                }

                `;

            const imgKeys = {
                "미국": "usa", "페루": "peru", "볼리비아": "bolivia",
                "일본": "japan", "호주": "australia", "중국": "china", "필리핀": "philippines", "라오스": "laos",
                "대만": "taiwan", "싱가포르": "singapore", "말레이시아": "malaysia", "태국": "thailand", "인도네시아": "indonesia",
                "영국": "uk", "프랑스": "france", "벨기에": "belgium", "네덜란드": "netherlands", "룩셈부르크": "luxembourg",
                "스페인": "spain", "이탈리아": "italy", "스위스": "switzerland", "독일": "germany",
                "체코": "czechia", "오스트리아": "austria", "슬로베니아": "slovenia", "크로아티아": "croatia",
                "이집트": "egypt", "남아공": "south_africa",
                "대한민국": "korea"
            }

                ;
            const imgKey = imgKeys[country] || "travel";
            slide.style.backgroundImage = `url('images/${imgKey}_main.jpg')`;

            slide.innerHTML = ` <div class="slide-content" > <h2>${country
                }

                </h2> <p>${travelData[country].desc
                }

                </p> <button class="explore-btn" onclick="openCountry('${country}', true)" >EXPLORE NOW</button> <div style="margin-top: 20px;">
                <button class="next-dest-slide-btn" onclick="returnToMap()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; backdrop-filter: blur(5px);">NEXT DESTINATION ✈️</button>
                </div> </div> `;
            slideContainer.appendChild(slide);
        });

        function moveSlide(direction) {
            const slides = document.querySelectorAll('.slide');
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // Custom Slow Scroll Function (2.5 seconds duration)
        function smoothScrollTo(targetY, duration) {
            const startY = window.pageYOffset;
            const distance = targetY - startY;
            let startTime = null;

            function animation(currentTime) {
                if (startTime === null) startTime = currentTime;
                const timeElapsed = currentTime - startTime;
                const run = easeInOutCubic(timeElapsed, startY, distance, duration);
                window.scrollTo(0, run);
                if (timeElapsed < duration) requestAnimationFrame(animation);
            }

            // Ease In Out Cubic - starts slow, fast in middle, ends slow
            function easeInOutCubic(t, b, c, d) {
                t /= d / 2;
                if (t < 1) return c / 2 * t * t * t + b;
                t -= 2;
                return c / 2 * (t * t * t + 2) + b;
            }

            requestAnimationFrame(animation);
        }

        function scrollToTop() {
            smoothScrollTo(0, 600);
        }

        function openCountry(country, scrollDown = false) {
            // [Fix] Enforce Visibility State
            const intro = document.getElementById('intro-page');
            const main = document.getElementById('main-content');
            const wasVisible = main ? main.classList.contains('visible') : false;
            if (intro) intro.classList.add('hidden');
            if (main) {
                main.classList.add('visible');
                main.style.opacity = "1"; // Ensure opacity
            }

            // Sync Map Logic State
            if (window.updateLastCountry) {
                window.updateLastCountry(country);
            }

            selectedCountry = country;
            const subPage = document.getElementById('sub-page');
            document.getElementById('country-title').innerText = country;

            // 1. 활성화
            subPage.classList.add('active');

            // 2. 렌더링
            const cityTabs = document.getElementById('city-tabs');
            cityTabs.innerHTML = "";
            const cityList = Object.keys(travelData[country].cities);

            cityList.forEach((city, idx) => {
                const btn = document.createElement('button');

                btn.className = `city-btn ${idx === 0 ? 'active' : ''
                    }

                    `;
                btn.innerText = city;
                btn.onclick = () => selectCity(city, btn);
                cityTabs.appendChild(btn);
            });
            selectCity(cityList[0], cityTabs.firstChild);

            // 3. 렌더링 완료 대기 후 스크롤
            // 3. 부드럽게 천천히 이동 (커스텀 함수 사용, 2.5초)
            // 약간의 지연을 주어 렌더링이 확실히 끝난 후 이동
            // Sync Slider (instant when revealing from map so old slide doesn't ghost-fade)
            const countryIdx = countries.indexOf(country);
            if (countryIdx !== -1) {
                setSlide(countryIdx, !wasVisible);
            }

            // Scroll Logic
            if (scrollDown) {
                const subPage = document.getElementById('sub-page');
                const targetPos = subPage.getBoundingClientRect().top + window.pageYOffset;
                smoothScrollTo(targetPos, 1000);
            } else if (window.scrollY > 0) {
                // Scroll to Top (Hero Slider)
                smoothScrollTo(0, 550);
            }
        }

        function setSlide(index, instant = false) {
            const slides = document.querySelectorAll('.slide');
            if (!slides[index]) return;

            if (instant) {
                slides.forEach(s => {
                    s.style.transition = 'none';
                });
            }

            slides[currentSlide].classList.remove('active');
            currentSlide = index;
            slides[currentSlide].classList.add('active');

            if (instant) {
                void slides[currentSlide].offsetWidth;
                slides.forEach(s => {
                    s.style.transition = '';
                });
            }
        }

        function selectCity(city, btn) {
            selectedCity = city;
            document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            showCategory('attractions');
        }

        function showCategory(category) {
            const data = travelData[selectedCountry].cities[selectedCity];
            const display = document.getElementById('content-display');

            document.querySelectorAll('.cat-link').forEach(l => {
                l.classList.remove('active');
                if (l.innerText.includes(category === 'attractions' ? '관광지' : category === 'cafes' ? '카페' : category === 'restaurants' ? '맛집' : category === 'activities' ? '액티비티' : '숙소')) l.classList.add('active');
            });

            let html = "";

            if (category === 'attractions') {
                html = data.attractions.map(a => `<div class="item-card" ><img src="${a.img}" alt="${a.name}" loading="lazy"><div class="item-info" ><h4>${a.name
                    }

                    </h4><p>${a.desc
                    }

                    </p></div></div>`).join('');
            }

            else if (category === 'restaurants') {

                // Restaurants might not have images, so we handle that gracefully or use a placeholder
                html = data.restaurants.map(r => `<div class="item-card" >${r.img ? `<img src="${r.img}" alt="${r.name}" loading="lazy"> ` : ''
                    }

                    <div class="item-info" ><h4>${r.name
                    }

                    </h4><p>${r.desc
                    }

                    </p></div></div>`).join('');
            }

            else if (category === 'cafes') {
                const vibes = data.cafes.vibe.map(v => `<div class="item-card" ><img src="${v.img}" alt="${v.name}" loading="lazy"><div class="item-info" ><span class="badge vibe" >분위기 & 뷰</span><h4>${v.name
                    }

                    </h4><p>${v.desc
                    }

                    </p></div></div>`).join('');

                const studies = data.cafes.study.map(s => `<div class="item-card" ><img src="${s.img}" alt="${s.name}" loading="lazy"><div class="item-info" ><span class="badge study" >카공 & 집중</span><h4>${s.name
                    }

                    </h4><p>${s.desc
                    }

                    </p></div></div>`).join('');
                html = vibes + studies;
            }

            else if (category === 'activities') {
                html = data.activities.map((act, i) => `<div class="item-card" ><img src="${act.img}" alt="${act.name}" loading="lazy"><div class="item-info" ><h4>${act.name
                    }

                    </h4><p>${act.desc
                    }

                    </p></div></div>`).join('');
            }

            else if (category === 'hotels') {
                html = data.hotels.map(h => `<div class="item-card" ><div class="item-info" ><h4>🏠 ${h.name
                    }

                    </h4><p>${h.desc
                    }

                    </p><span class="price-tag" >${h.price
                    }

                    </span></div></div>`).join('');
            }

            display.innerHTML = html;
        }

    </script>
    <script src="./scripts/map_logic.js"></script>
</body>

</html>
